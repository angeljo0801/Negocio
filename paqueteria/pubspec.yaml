name: paqueteria
publish_to: 'none'
description: Herramientas de negocio para paqueteria a Cuba.
version: 2.3.0+14

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  workmanager: ^0.10.10
  flutter_local_notifications: 21.0.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/icon.png
  adaptive_icon_background: '#0B3D91'
  adaptive_icon_foreground: assets/icon.png
