name: Compilar APK Finanzas Definitiva

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - ".github/finance_bot.dart"
      - ".github/finance_ai_service.dart"
      - ".github/finance_ai_settings.dart"
      - ".github/finance_ai_chat.dart"
      - ".github/paqueteria_sync.dart"
      - ".github/finance_main_activity.kt"
      - ".github/LocalAiManagerBridge.kt"
      - ".github/patch_finanzas.py"
      - ".github/archive-parts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir aplicación
        run: |
          cat .github/archive-parts/part-* > Finanzas_Definitiva_Flutter_v3.zip
          echo "05d465ef3bfb2802934e2b68991e96bdb1e491ad3b825fe9c779805b5b6e1970  Finanzas_Definitiva_Flutter_v3.zip" | sha256sum --check
          unzip -o Finanzas_Definitiva_Flutter_v3.zip
          cp .github/finance_bot.dart finanzas_definitiva/lib/finance_bot.dart
          cp .github/finance_ai_service.dart finanzas_definitiva/lib/finance_ai_service.dart
          cp .github/finance_ai_settings.dart finanzas_definitiva/lib/finance_ai_settings.dart
          cp .github/finance_ai_chat.dart finanzas_definitiva/lib/finance_ai_chat.dart
          cp .github/paqueteria_sync.dart finanzas_definitiva/lib/paqueteria_sync.dart

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear archivos Android
        working-directory: finanzas_definitiva
        run: flutter create . --platforms=android --org com.angel.finanzas

      - name: Aplicar integración
        run: |
          mkdir -p finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/finanzas_definitiva
          cp .github/finance_main_activity.kt finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/finanzas_definitiva/MainActivity.kt
          cp .github/LocalAiManagerBridge.kt finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/finanzas_definitiva/LocalAiManagerBridge.kt
          python3 .github/patch_finanzas.py

      - name: Descargar dependencias
        working-directory: finanzas_definitiva
        run: flutter pub get

      - name: Analizar código
        working-directory: finanzas_definitiva
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Generar icono de la aplicación
        working-directory: finanzas_definitiva
        run: dart run flutter_launcher_icons

      - name: Ejecutar pruebas
        working-directory: finanzas_definitiva
        run: flutter test

      - name: Compilar APK
        working-directory: finanzas_definitiva
        run: flutter build apk --release

      - name: Renombrar APK
        run: cp finanzas_definitiva/build/app/outputs/flutter-apk/app-release.apk Finanzas-Definitiva-v2.4.6.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Definitiva-APK
          path: Finanzas-Definitiva-v2.4.6.apk
          retention-days: 30
