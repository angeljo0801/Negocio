name: Compilar APK Finanzas Definitiva

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir aplicación
        run: |
          cat .github/archive-parts/part-* > Finanzas_Definitiva_Flutter_v3.zip
          echo "05d465ef3bfb2802934e2b68991e96bdb1e491ad3b825fe9c779805b5b6e1970  Finanzas_Definitiva_Flutter_v3.zip" | sha256sum --check
          unzip -o Finanzas_Definitiva_Flutter_v3.zip

      - name: Inspeccionar fuente para integracion
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Source-Snapshot
          path: |
            finanzas_definitiva/lib
            finanzas_definitiva/pubspec.yaml
          retention-days: 2

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear archivos Android
        working-directory: finanzas_definitiva
        run: flutter create . --platforms=android --org com.angel.finanzas

      - name: Descargar dependencias
        working-directory: finanzas_definitiva
        run: flutter pub get
        
      - name: Generar icono de la aplicacion
        working-directory: finanzas_definitiva
        run: dart run flutter_launcher_icons
        
      - name: Ejecutar pruebas
        working-directory: finanzas_definitiva
        run: flutter test

      - name: Compilar APK
        working-directory: finanzas_definitiva
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Definitiva-APK
          path: finanzas_definitiva/build/app/outputs/flutter-apk/app-release.apk
