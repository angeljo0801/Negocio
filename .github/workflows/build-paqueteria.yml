name: Build Paqueteria APK

on:
  push:
    branches: ["paqueteria-v1"]
    paths:
      - "paqueteria/**"
      - ".github/workflows/build-paqueteria.yml"
      - ".github/patch_paqueteria.py"
      - ".github/patch_gmail_*.py"
      - ".github/patch_paqueteria_migration_signing.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria app
          rm -rf app/lib app/test
          cp -R paqueteria/lib app/lib
          cp paqueteria/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          rsvg-convert -w 1024 -h 1024 paqueteria/assets/icon.svg -o app/assets/icon.png

      - name: Load permanent Paqueteria signing key
        shell: bash
        run: |
          set -euo pipefail
          VAULT_URL="https://wasbot-backend-production.up.railway.app/api/ci/paqueteria-signing"

          TOKEN_RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=paqueteria-signing")"
          OIDC_TOKEN="$(printf '%s' "$TOKEN_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          HTTP_CODE="$(curl -sS -o /tmp/paqueteria-signing.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "$VAULT_URL")"

          if [ "$HTTP_CODE" = "404" ]; then
            SIGNING_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(40))')"
            export SIGNING_PASSWORD
            keytool -genkeypair -noprompt \
              -storetype PKCS12 \
              -keystore /tmp/paqueteria-release.p12 \
              -storepass "$SIGNING_PASSWORD" \
              -keypass "$SIGNING_PASSWORD" \
              -alias paqueteria \
              -keyalg RSA \
              -keysize 3072 \
              -validity 36500 \
              -dname "CN=Paqueteria, OU=AlasCargo, O=AlasCargo, L=Miami, ST=Florida, C=US"

            python3 - <<'PY' > /tmp/paqueteria-signing-upload.json
          import base64, json, os
          from pathlib import Path
          print(json.dumps({
              "keystoreB64": base64.b64encode(Path('/tmp/paqueteria-release.p12').read_bytes()).decode('ascii'),
              "password": os.environ['SIGNING_PASSWORD'],
              "alias": "paqueteria",
              "storeType": "PKCS12",
          }))
          PY

            UPLOAD_CODE="$(curl -sS -o /tmp/paqueteria-signing-upload-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/paqueteria-signing-upload.json \
              "$VAULT_URL")"
            if [ "$UPLOAD_CODE" != "200" ] && [ "$UPLOAD_CODE" != "409" ]; then
              cat /tmp/paqueteria-signing-upload-response.json
              exit 1
            fi

            HTTP_CODE="$(curl -sS -o /tmp/paqueteria-signing.json -w '%{http_code}' \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              "$VAULT_URL")"
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/paqueteria-signing.json
            exit 1
          fi

          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/paqueteria-signing.json').read_text())
          Path('app/android/app/paqueteria-release.p12').write_bytes(base64.b64decode(data['keystoreB64']))
          password = str(data['password'])
          alias = str(data['alias'])
          print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PAQUETERIA_KEYSTORE_PASSWORD={password}\n')
              env.write(f'PAQUETERIA_KEY_PASSWORD={password}\n')
              env.write(f'PAQUETERIA_KEY_ALIAS={alias}\n')
          PY

      - name: Patch source and Android
        run: |
          python3 .github/patch_paqueteria.py
          python3 .github/patch_gmail_main.py
          python3 .github/patch_gmail_packages_core.py
          python3 .github/patch_gmail_packages_methods.py
          python3 .github/patch_gmail_packages_ui.py
          python3 .github/patch_gmail_purchases_core.py
          python3 .github/patch_gmail_purchases_methods.py
          python3 .github/patch_gmail_purchases_ui.py
          python3 .github/patch_gmail_background.py
          python3 .github/patch_gmail_final_fix.py
          python3 .github/patch_paqueteria_migration_signing.py

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify release signing
        run: |
          keytool -list -v \
            -keystore app/android/app/paqueteria-release.p12 \
            -storepass "$PAQUETERIA_KEYSTORE_PASSWORD" \
            -alias "$PAQUETERIA_KEY_ALIAS" | grep -E 'SHA256:|Alias name:'

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Paqueteria-v2.5.1-stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-v2.5.1-Stable-APK
          path: Paqueteria-v2.5.1-stable.apk
          retention-days: 30
