name: Build Paqueteria APK

on:
  push:
    branches: ["paqueteria-v1"]
    paths:
      - "paqueteria/**"
      - ".github/workflows/build-paqueteria.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria app
          rm -rf app/lib app/test
          cp -R paqueteria/lib app/lib
          cp paqueteria/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          rsvg-convert -w 1024 -h 1024 paqueteria/assets/icon.svg -o app/assets/icon.png

      - name: Patch source and Android configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/lib/packages.dart')
          s = p.read_text()
          s = s.replace(
              "clients=active(r[0]);purchases=active(r[1]);recipients=active(r[2]);",
              "clients=active(r[0] as List<Map<String,dynamic>>);purchases=active(r[1] as List<Map<String,dynamic>>);recipients=active(r[2] as List<Map<String,dynamic>>);"
          )
          s = s.replace("Uri?u;switch(carrier)", "late final Uri u;switch(carrier)")
          p.write_text(s)

          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />')
          m = m.replace('android:label="paqueteria"', 'android:label="Paquetería"')
          manifest.write_text(m)

          gradle = Path('app/android/app/build.gradle.kts')
          g = gradle.read_text()
          deps = '''\ndependencies {\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")\n    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-korean:16.0.1")\n}\n'''
          if 'com.google.mlkit:text-recognition-chinese' not in g:
              g += deps
          gradle.write_text(g)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze source
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee ../analyze.txt

      - name: Upload analyzer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-Analyzer
          path: analyze.txt
          retention-days: 7

      - name: Build release APK and capture diagnostics
        working-directory: app
        run: |
          set +e
          flutter build apk --release 2>&1 | tee ../build.txt
          code=${PIPESTATUS[0]}
          echo "$code" > ../build.exit
          exit 0

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-Build-Diagnostics
          path: |
            build.txt
            build.exit
          retention-days: 7

      - name: Validate build
        run: test "$(cat build.exit)" = "0"

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Paqueteria-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-APK
          path: Paqueteria-v1.0.apk
          retention-days: 30
