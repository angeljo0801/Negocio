name: Build Paqueteria APK

on:
  push:
    branches: ["paqueteria-v1"]
    paths:
      - "paqueteria/**"
      - ".github/workflows/build-paqueteria.yml"
      - ".github/patch_paqueteria.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria app
          rm -rf app/lib app/test
          cp -R paqueteria/lib app/lib
          cp paqueteria/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          rsvg-convert -w 1024 -h 1024 paqueteria/assets/icon.svg -o app/assets/icon.png

      - name: Patch source and Android
        run: python3 .github/patch_paqueteria.py

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Paqueteria-v2.3.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-v2.3.1-APK
          path: Paqueteria-v2.3.1.apk
          retention-days: 30
